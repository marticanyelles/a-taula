<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5a">
<!-- L'app no es connecta a cap servidor: si algun text de l'Excel intentés carregar o enviar res a fora, el navegador ho bloqueja -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; worker-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>A taula!</title>
<!-- Publicada a la web (GitHub Pages) es pot instal·lar com una app; obrint l'HTML com a fitxer, aquestes línies no fan res -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A5%97%3C/text%3E%3C/svg%3E">
<style>:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface2:#efece4; --text:#1d1f1c; --muted:#5f655d; --line:#dcd7cc;
  --accent:#2f6f5a; --accent-ink:#ffffff; --accent-soft:#dcebe4;
  --nevera:#2a6fb0; --nevera-soft:#dde9f6; --cong:#1f8a9c; --cong-soft:#d8f0f3;
  --cuinar:#b5561e; --cuinar-soft:#f8e3d5; --prep:#7a5ab8; --prep-soft:#ebe3f7;
  --warn:#a86a00; --warn-soft:#fbefd5; --danger:#b3261e; --danger-soft:#f9dedc; --ia:#6a4fb3; --ia-soft:#e9e2fa;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
  --r:16px; --fs:17px; --tab-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121412; --surface:#1c1f1c; --surface2:#262a26; --text:#eef0ec; --muted:#a7ada4; --line:#343a34;
    --accent:#7cc7a9; --accent-ink:#0d1f18; --accent-soft:#1f3a30;
    --nevera:#8cbcf0; --nevera-soft:#1d3047; --cong:#7fd3df; --cong-soft:#173a40;
    --cuinar:#f2a774; --cuinar-soft:#45291a; --prep:#c3aaf2; --prep-soft:#33284a;
    --warn:#f0c060; --warn-soft:#3d3015; --danger:#f2a39d; --danger-soft:#47201d; --ia:#c9b6ff; --ia-soft:#30284a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121412; --surface:#1c1f1c; --surface2:#262a26; --text:#eef0ec; --muted:#a7ada4; --line:#343a34;
  --accent:#7cc7a9; --accent-ink:#0d1f18; --accent-soft:#1f3a30;
  --nevera:#8cbcf0; --nevera-soft:#1d3047; --cong:#7fd3df; --cong-soft:#173a40;
  --cuinar:#f2a774; --cuinar-soft:#45291a; --prep:#c3aaf2; --prep-soft:#33284a;
  --warn:#f0c060; --warn-soft:#3d3015; --danger:#f2a39d; --danger-soft:#47201d; --ia:#c9b6ff; --ia-soft:#30284a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark;
}
:root[data-size="big"]{--fs:20px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;min-height:100vh;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.top h1{font-size:1.15em;margin:0;flex:1;letter-spacing:-.01em}
.iconbtn{border:0;background:var(--surface2);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.season{font-size:.75em;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:16px}
.view{animation:viewIn .18s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.tabbar button{border:0;background:none;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:.68em;font-weight:600;color:var(--muted);transition:color .15s;min-width:0}
.tabbar button svg{width:24px;height:24px;transition:transform .15s}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"] svg{transform:translateY(-1px) scale(1.08)}
h2{font-size:1.05em;margin:22px 0 10px;letter-spacing:-.01em}
h2:first-child{margin-top:4px}
.sub{color:var(--muted);font-size:.85em}

.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}
.sub{color:var(--muted);font-size:.85em}
.h3{font-size:.8em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
main.view.wide{max-width:1180px}
/* botons */
.btn{border:0;border-radius:12px;padding:11px 16px;min-height:44px;font-weight:650;background:var(--surface2);transition:transform .12s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.88em}
.btn.wide{width:100%}
.btn.danger,.btn.danger-t{background:var(--danger-soft);color:var(--danger)}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;min-height:34px;font-size:.84em;font-weight:650;color:var(--text);transition:background .15s,transform .12s}
.mini:hover{background:var(--surface2)}.mini:active{transform:scale(.96)}
.mini:disabled{opacity:.6}
.link{border:0;background:none;padding:2px 0;color:var(--accent);font-weight:650;font-size:.92em;text-align:left;cursor:pointer}
.link:hover{text-decoration:underline}
.links{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sync{border:0;border-radius:99px;padding:6px 12px;font-size:.74em;font-weight:700;min-height:32px}
.sync.ok{background:var(--accent-soft);color:var(--accent)}.sync.busy{background:var(--warn-soft);color:var(--warn)}.sync.warn{background:var(--danger-soft);color:var(--danger)}
/* etiquetes */
.tag{display:inline-flex;align-items:center;gap:3px;font-size:.7em;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap;line-height:1.3}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.t-sum{background:#fff1d6;color:#9a5b00}.t-win{background:#e0ecfb;color:#2a5fa0}
.t-ia{background:var(--ia-soft);color:var(--ia)}.t-fam{background:var(--accent-soft);color:var(--accent)}
.t-lact{background:var(--danger-soft);color:var(--danger)}.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-cong{background:var(--cong-soft);color:var(--cong)}.t-prep{background:var(--prep-soft);color:var(--prep)}
:root[data-theme="dark"] .t-sum{background:#3d2f12;color:#f3c66b}:root[data-theme="dark"] .t-win{background:#1b2c45;color:#9cc4f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-sum{background:#3d2f12;color:#f3c66b}:root:not([data-theme="light"]) .t-win{background:#1b2c45;color:#9cc4f5}}
/* segmentat i xips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-weight:650;font-size:.86em;white-space:nowrap;min-height:38px;color:var(--muted);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
/* àpats */
.meal{transition:opacity .2s}
.meal.is-done{opacity:.6}
.meal-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.apat{font-size:.74em;text-transform:uppercase;letter-spacing:.07em;font-weight:750;color:var(--muted)}
.meal-name{display:block;width:100%;text-align:left;border:0;background:none;padding:2px 0;font-size:1.08em;font-weight:680;line-height:1.3;color:var(--text)}
.acomp{display:block;font-size:.88em;color:var(--muted);font-weight:600}
.macro{display:block;font-size:.78em;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.donebox{display:inline-flex;align-items:center;gap:6px;font-size:.8em;font-weight:650;color:var(--muted);cursor:pointer}
.donebox input,.check input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;margin:0;display:grid;place-items:center;transition:background .15s,border-color .15s;cursor:pointer}
.donebox input:checked,.check input:checked{background:var(--accent);border-color:var(--accent)}
.donebox input:checked::after,.check input:checked::after{content:"";width:6px;height:12px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px);animation:pop .18s ease-out}
@keyframes pop{from{transform:rotate(45deg) scale(.4)}to{transform:rotate(45deg) scale(1)}}
.check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.orig-h{font-size:.95em;margin:14px 0 6px}.orig-h:first-of-type{margin-top:4px}
.task-open{cursor:pointer}
.tgrp{margin:14px 0 6px}
.donefold{border-top:1px solid var(--line);margin-top:2px}.donefold summary{cursor:pointer;padding:10px 0;font-weight:650;color:var(--muted);font-size:.9em}.donefold[open] summary{border-bottom:1px solid var(--line)}.tgrp.pm{margin-top:22px;color:#4a5fa8}
.card.pmcard{background:color-mix(in srgb,#4a5fa8 7%,var(--surface));border:1px dashed color-mix(in srgb,#4a5fa8 40%,var(--line))}
.cookbtn{border:0;border-radius:99px;padding:6px 12px;min-height:36px;font-weight:700;font-size:.84em;background:var(--accent);color:var(--accent-ink);white-space:nowrap;flex:none;animation:pop .2s ease-out}
.cookbtn b{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:4px;border-radius:99px;background:var(--accent-ink);color:var(--accent);font-size:.85em}
.sheet.cooking{max-height:100vh;height:100vh;height:100dvh;border-radius:0}
.cook-nav{display:flex;align-items:center;gap:8px;margin:0 0 6px}.cook-nav .iconbtn{width:40px;height:40px;font-size:1.4em;font-weight:700}
.cdots{flex:1;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.cdot{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line)}.cdot.on{background:var(--accent);transform:scale(1.25)}
.cook-car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;align-items:flex-start}.cook-car::-webkit-scrollbar{display:none}
.cook-slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;padding:2px 2px 24px;box-sizing:border-box}
.cook-h{font-size:1.25em;margin:4px 0 8px}.cook-meta{gap:12px;align-items:center}.cook-sub{margin:16px 0 4px;font-size:1em}
.cook-ing{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}.cook-ing summary{font-weight:700;cursor:pointer}
.cook-slide .steps li{font-size:1.08em;line-height:1.5;cursor:pointer}.cook-slide .steps li.sdone{opacity:.45;text-decoration:line-through}
.cook-act{gap:10px;margin-top:16px;align-items:center}
.tt-row{display:flex;align-items:baseline;gap:10px}.tt-row .tt{flex:1;min-width:0}.tmin{flex:none;font-size:.8em;color:var(--muted);white-space:nowrap}
.potseg{margin-top:8px}.potseg button{flex:0 1 auto}
.potbox{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);font-size:.86em}.potbox ul{margin:4px 0;padding-left:18px}
.wake-ind{margin:0 0 8px;font-size:.78em;color:var(--accent)}.wake-ind.off{color:#b7791f;font-weight:650}
.portion{margin:8px 0 0}.task-open:hover{color:var(--accent)}
.check.done .tt{color:var(--muted);text-decoration:line-through}
.ct{flex:1;min-width:0}.tt{font-weight:600}
.ct small{display:block;color:var(--muted);font-size:.8em;margin-top:2px}
.qty{font-weight:700;white-space:nowrap;text-align:right}.qty small{display:block;font-weight:500;color:var(--muted);font-size:.76em}
.empty-ok{color:var(--accent);font-weight:650}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.alert{border-left:4px solid var(--warn);background:var(--warn-soft)}
.alert.danger{border-left-color:var(--danger);background:var(--danger-soft)}
.compact-list .cl-row{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.compact-list .cl-row:last-child{border-bottom:0}.compact-list .apat{width:78px;flex:none}
.hero p{margin:8px 0 14px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px 16px;text-align:center;margin-top:12px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:.88em;cursor:pointer}
/* totals */
.totals .split{display:flex;height:8px;border-radius:99px;overflow:hidden;margin:10px 0 6px;gap:2px}
.split .p{background:var(--accent)}.split .h{background:#d9a441}.split .g{background:#c46a4a}
.tot-row{display:grid;grid-template-columns:90px 1fr 1fr;gap:4px 12px;align-items:center;font-size:.84em;margin-top:8px}
.tot-row span{display:flex;flex-direction:column;gap:3px}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar i.low{background:#d9a441}.bar i.high{background:#c46a4a}
@media (max-width:520px){.tot-row{grid-template-columns:1fr}}
/* calendari */
.calhead{display:flex;align-items:center;gap:8px;margin:14px 0 10px}
.calhead h2{margin:0;flex:1;text-align:center}
.calhead h2::first-letter{text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:.7em;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.day{border:0;background:var(--surface);border-radius:10px;min-height:118px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;box-shadow:var(--shadow);transition:background .15s}
.day .n{font-weight:750;font-size:.9em}
.day .l{font-size:.56em;line-height:1.18;color:var(--muted);white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;hyphens:auto;overflow-wrap:break-word;word-break:normal}
.day .l+.l{border-top:1px dashed var(--line);padding-top:2px;margin-top:1px}
.day .l.din{color:var(--text)}
.day.other{opacity:.45}.day.today{outline:2px solid var(--accent)}.day.sel{background:var(--accent-soft)}
.day .dots{display:flex;gap:3px;margin-top:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.dot.sw{background:var(--prep)}
@media (min-width:620px){.day{min-height:132px;padding:7px}.day .l{font-size:.72em;-webkit-line-clamp:3}}
/* planificador */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:none;overscroll-behavior-x:contain}
.carousel::-webkit-scrollbar{display:none}
.pday{flex:0 0 calc(100% - 28px);max-width:440px;scroll-snap-align:start;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px;min-height:calc(100vh - 230px);display:flex;flex-direction:column;gap:10px}
.pday.today{outline:2px solid var(--accent)}
.pday header{display:flex;flex-direction:column;gap:2px}
.pday header b::first-letter{text-transform:uppercase}
.pday header b{font-size:1.1em}
.pday .totals{box-shadow:none;background:var(--surface2);margin:auto 0 0}
.pmeal{border-top:1px solid var(--line);padding-top:10px}
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ptile{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:74px;transition:border-color .15s,background .15s,transform .12s}
.ptile:active{transform:scale(.97)}
.ptile.cur{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.pt-name{font-weight:650;font-size:.84em;line-height:1.25}
.pt-ac{font-size:.72em;color:var(--muted);line-height:1.2}
.pt-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:auto;font-size:.7em;color:var(--muted)}
.tlist{margin:6px 0 0;padding-left:18px;font-size:.86em}
.cdots{display:flex;justify-content:center;gap:6px}
.cdots i{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer;transition:background .2s,transform .2s}
.cdots i.on{background:var(--accent);transform:scale(1.3)}
.pgrid-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.pgrid{border-collapse:separate;border-spacing:4px;min-width:760px;width:100%}
.pgrid th{font-size:.72em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:4px;vertical-align:top}
.pgrid th.today{color:var(--accent)}
.pgrid td{vertical-align:top}
.pcell{width:100%;min-height:62px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 7px;text-align:left;font-size:.76em;font-weight:600;line-height:1.25}
.pcell small{display:block;font-weight:500;color:var(--muted)}
.pcell.chg{border-color:var(--prep)}
.tmini{font-size:.9em;line-height:1.3;margin-bottom:3px}
/* opcions (full inferior) */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 13px;align-items:center;justify-content:space-between;min-height:56px;transition:border-color .15s,background .15s}
.opt.cur{border-color:var(--accent);background:var(--accent-soft)}
.o-main{display:flex;flex-direction:column;gap:2px;min-width:0}.o-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;text-align:right}
/* receptari */
.searchbar{position:sticky;top:calc(69px + env(safe-area-inset-top));z-index:5;background:var(--bg);padding:2px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;box-shadow:var(--shadow)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input[type=search]{border:0;background:none;box-shadow:none;padding:12px 0;min-height:48px;outline:none;flex:1}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;min-height:36px;font-size:.84em;font-weight:650;white-space:nowrap;color:var(--text);transition:background .15s,color .15s,border-color .15s}
.fchip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.count{font-size:.75em;color:var(--muted);font-weight:600;background:var(--surface2);border-radius:99px;padding:2px 8px;vertical-align:middle}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rcard{position:relative;border:0;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:13px 14px 12px 18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;overflow:hidden;transition:transform .15s,box-shadow .15s}
.rcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cc,var(--accent))}

/* v8.6 */
.today-top{gap:8px;margin-bottom:6px;flex-wrap:wrap}
.up-head{margin-top:22px;align-items:center}.up-head h2{margin:0}
.h3.up-day{margin:14px 0 6px;display:flex;gap:8px;align-items:center}
.nutri-line{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;cursor:pointer;font:inherit;font-size:.86em;color:var(--text);margin-top:4px}
.nutri-line .nl-t{display:flex;flex-direction:column;gap:1px}
.nutri-line.ok .nl-ic{color:var(--accent);font-weight:800}
.nutri-line.bad{border-color:#d9a441}.nutri-line.bad .nl-ic{color:#b7791f;font-weight:800}
.nutri-line:hover{background:var(--surface2)}
.pgrid .nutri-line{font-size:.78em}
.is-row{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;font:inherit;color:var(--text);text-align:left;cursor:pointer}
.is-row:last-child{border-bottom:0}.is-row small{color:var(--muted)}.is-row:hover span{color:var(--accent)}
.is-row[disabled]{cursor:default;opacity:.55}
.tabbar{grid-template-columns:repeat(5,1fr)}
.tabbar button{font-size:.7em}
@media (min-width:700px){.tabbar button{font-size:.76em}}
/* pestanyes centrades i agrupades en pantalla ampla, com al mòbil */
@media (min-width:620px){.tabbar{grid-template-columns:repeat(5,minmax(0,104px));justify-content:center}}
/* Revisió del 27/10/2026: cap vista més ampla que la pantalla, caselles fàcils de tocar, contrast i focus */
:root{--warn-t:#8a5600;--cong-t:#16707f;--prep-t:#6a49a8;--pm:#4a5fa8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--warn-t:var(--warn);--cong-t:var(--cong);--prep-t:var(--prep);--pm:#9fb0f0}}
:root[data-theme="dark"]{--warn-t:var(--warn);--cong-t:var(--cong);--prep-t:var(--prep);--pm:#9fb0f0}
.t-warn,.warn-t{color:var(--warn-t)}.t-cong{color:var(--cong-t)}.t-prep{color:var(--prep-t)}
.tgrp.pm{color:var(--pm)}.card.pmcard{background:color-mix(in srgb,var(--pm) 7%,var(--surface));border-color:color-mix(in srgb,var(--pm) 40%,var(--line))}
.wake-ind.off{color:var(--warn-t)}
.meal-h{flex-wrap:wrap;row-gap:4px}.meal-h>*{min-width:0}.meal-h .mtime .tag{font-size:.85em}
.qty{white-space:normal;max-width:44%;overflow-wrap:anywhere}.qty small{white-space:normal}
.check .ct{min-width:0;overflow-wrap:anywhere}
.top h1{min-width:3em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donebox{padding:10px;margin:-10px;border-radius:12px}
.donebox input,.check input{border-color:var(--muted)}
@media (max-width:420px){.seg button{padding:8px 6px;font-size:.8em}}
.pchip{min-height:28px;padding:3px 10px}
.stepper.sm button{width:40px;height:40px}
.cdot{box-sizing:content-box;padding:9px;background-clip:content-box}.cdot.on{background-clip:content-box}
.search:focus-within{outline:2px solid var(--accent);outline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet:not(.open){visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s linear .24s}
.toast{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:12px}
.toast button{border:0;background:none;color:inherit;font-weight:800;text-decoration:underline;padding:4px;min-height:32px}
.cook-slide .steps li:focus-visible{outline-offset:4px}
/* Capçalera al mòbil: amb «Cuinant» i l'estat de l'Excel alhora no ha de passar de l'amplada */
@media (max-width:440px){.cookbtn .ck-l{display:none}.cookbtn{padding:6px 10px}.sync{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
/* Tasques i àpats junts: els botons de canviar i saltar sempre a la dreta */
.mrow .ct{display:flex;flex-direction:column;align-items:flex-start;gap:1px}.mrow .meal-name{padding:0;font-size:1.02em}
.mr-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%}.mr-act{display:flex;gap:6px;flex:none;align-self:flex-start}
.mrow small{color:var(--muted);font-size:.82em;margin-top:2px}.mrow.is-skip .meal-name{color:var(--muted);text-decoration:line-through}
.mrow.done .meal-name,.mrow.done .acomp{color:var(--muted)}
/* Propers dies: una línia per tasca */
.upday{padding:10px 14px}.ud-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px}
.urow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.urow .donebox input{width:22px;height:22px}.ur-t{flex:1;min-width:0;border:0;background:none;padding:2px 0;text-align:left;font:inherit;font-size:.94em;color:var(--text);cursor:pointer}
.ur-t:hover{color:var(--accent)}.urow.done .ur-t{color:var(--muted);text-decoration:line-through}.ud-act{gap:14px;margin-top:4px}
/* Receptes en files */
.rgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.rcard.rrow{min-height:0;padding:10px 12px 10px 16px;gap:4px;border-radius:12px}.rrow .rc-meta{flex-wrap:wrap;align-items:center;gap:4px 10px}.rrow .rc-meta .tag{font-size:.9em}
/* Animació en marcar */
.check.leaving,.urow.leaving{animation:leave .23s ease-in forwards}@keyframes leave{to{opacity:0;transform:translateX(14px)}}
.donefold summary.flash{animation:flash .9s ease-out;border-radius:8px}@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
/* Dues columnes al portàtil */
.tcols{display:grid;grid-template-areas:"top" "side" "bot";grid-template-columns:minmax(0,1fr)}.tc-top{grid-area:top;min-width:0}.tc-side{grid-area:side;min-width:0}.tc-bot{grid-area:bot;min-width:0}
@media (min-width:1100px){
  .tcols{grid-template-areas:"top side" "bot side";grid-template-columns:minmax(0,1fr) 360px;column-gap:28px;align-items:start}
  .tc-side{position:sticky;top:84px}
  .shopcols{columns:2;column-gap:24px}.shopgrp{break-inside:avoid}
  .rgrid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
}
main.view.cols{max-width:760px}
@media (min-width:1100px){main.view.cols{max-width:1180px}}
/* Botons Temporitzador i Historial: a dalt al mòbil, a la columna de la dreta al portàtil */
.wide-only{display:none}
@media (min-width:1100px){.narrow-only{display:none!important}.wide-only{display:flex}.side-tools{justify-content:flex-end;margin-top:4px}}
.bp-who{white-space:nowrap}
/* Capçalera d'Avui: la data, petita i grisa, al costat */
.today-h{display:flex;align-items:center;gap:8px;margin-top:4px}.today-h h2{flex:1;min-width:0;margin:10px 0 6px}
.today-h h2 .sub{font-size:.62em;font-weight:500;margin-left:6px;letter-spacing:0}.today-h .iconbtn{width:40px;height:40px;font-size:1.05em}
@media (min-width:1100px){.side-tools{margin-top:12px}}
/* Qui fa cada cosa */
.tag.who0{background:var(--nevera-soft);color:var(--nevera)}.tag.who1{background:var(--prep-soft);color:var(--prep-t)}.tag.who2{background:var(--cuinar-soft);color:var(--cuinar)}.tag.who3{background:var(--cong-soft);color:var(--cong-t)}
.ses-card{padding:10px 14px}.ses-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}.ses-row .tag{flex:none;margin-top:2px}
.ses-l{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}.ses-i{font-weight:650;color:var(--text);padding:0}.ses-i.next{color:var(--accent);text-decoration:underline}.ses-i.done{color:var(--muted);text-decoration:line-through;font-weight:500}.ses-a{color:var(--muted)}
.bp-who .tag{font-size:.95em}
/* Temporitzadors */
.tmr{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 8px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.timerbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 10px + env(safe-area-inset-bottom));z-index:55;display:flex;flex-direction:column;gap:6px;width:min(560px,calc(100% - 24px))}
body.sheet-open .timerbar{bottom:calc(10px + env(safe-area-inset-bottom))}
body.has-timers .toast{bottom:calc(var(--tab-h) + 24px + var(--tbh, 0px) + env(safe-area-inset-bottom))}
body.sheet-open.has-timers .toast{bottom:calc(20px + var(--tbh, 0px) + env(safe-area-inset-bottom))}
body.has-timers .sheet{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.tchip{display:flex;align-items:center;gap:10px;background:var(--text);color:var(--bg);border-radius:14px;padding:8px 10px 8px 14px;box-shadow:var(--shadow)}
.tchip .tc-l{flex:1;min-width:0;font-size:.85em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tchip b{font-variant-numeric:tabular-nums;font-size:1.15em}
.tchip button{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:inherit;border-radius:10px;min-width:40px;min-height:36px;font-weight:800}
.tchip.over{background:var(--danger);color:#fff;animation:ring 1s ease-in-out infinite}@keyframes ring{50%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.tchip.over{animation:none}}
/* Nutrició de la setmana i pla de la sessió */
.nw-row{display:grid;grid-template-columns:76px 1fr;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:.92em}
.nw-row .bar{grid-column:1/-1}.nw-n{font-weight:650}.nw-v{font-variant-numeric:tabular-nums;text-align:right}.nw-d{grid-column:1/-1;font-size:.82em;color:var(--muted)}
.nw-row.warn .nw-d,.nw-row.warn .nw-n{color:var(--warn-t);font-weight:700}
.bplan{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}.bplan li{display:flex;flex-direction:column}.bp-n{text-align:left;font-weight:700;font-size:1em;padding:0}
/* Cuinant amb el mòbil de costat: capçalera compacta perquè es vegin els passos */
@media (orientation:landscape) and (max-height:500px){
  .sheet.cooking .grab{padding-block:2px}.sheet.cooking .wake-ind{display:none}
  .sheet.cooking .cook-nav{margin:0}.sheet.cooking .cook-nav .iconbtn{width:34px;height:34px}
  .sheet.cooking .cook-h{font-size:1.05em;margin:0 0 4px}.sheet.cooking .portion{display:none}
}

</header>
<main id="view" class="view"></main>
<nav class="tabbar" aria-label="Navegació">
  <button data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Avui</button>

  <button data-view="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>Compra</button>
  <button data-view="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v3H8z"/><path d="M7 6h10a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M5 12h14"/></svg>Rebost</button>
  <button data-view="recipes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M18 20h2V7M8 9h6M8 13h6"/></svg>Receptes</button>
</nav>
<div class="overlay" id="overlay"></div>

  <div id="sheetBody"></div>

}
function recipeSheetUpdates(wb, ids) {
  const hdr = n => (XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1 })[0] || []).map(h => String(h).trim());
  const hR = hdr("Receptes"), hI = hdr("Receptes_Ingredients");

/* ================= Cuinant: diverses receptes alhora ================= */
// Les receptes en marxa es guarden en aquest dispositiu (SET.cooking): id, racions i passos ja fets.
const cookList = () => (SET.cooking || []).filter(c => DB?.receptes[c.id]);
const isCooking = id => cookList().some(c => c.id === id);
function startCooking(id, rac) { SET.cooking = [...cookList().filter(c => c.id !== id), { id, rac: Math.max(1, Math.round(rac || 1)), done: [] }]; saveSET(); renderCooking(); }
function stopCooking(id) { SET.cooking = cookList().filter(c => c.id !== id); saveSET(); renderCooking(); }
function renderCooking() {
  const b = $("#cookingB"); if (!b) return; const n = DB ? cookList().length : 0;
  b.hidden = !n; b.querySelector("b").textContent = n; b.onclick = () => openCooking();
}
function cookSlide(c, i) {
  const r = DB.receptes[c.id], rac = c.rac;
  const ings = (DB.ri[c.id] || []).map(l => {
    const isRec = l.ID_Ingredient.startsWith("REC-"), ing = DB.ingredients[l.ID_Ingredient], q = num(l.Quantitat_Per_Racio) * rac;
    const qtxt = isRec ? racTxt(l.ID_Ingredient, q) : (ing?.Tipus === "No es compra" && !q ? "" : fmtQty(q, l.Unitat));
    return `<div class="ing"><span class="q">${qtxt}</span><span class="n">${esc(isRec ? recName(l.ID_Ingredient) : ing?.Nom || l.Nom_Ingredient || l.ID_Ingredient)}${yes(l.Opcional) ? ` <span class="tag">opcional</span>` : ""}</span></div>`;
  }).join("");
  const steps = String(r.Passos || "").split(/\n+/).map(x => x.replace(/^\d+\.\s*/, "").trim()).filter(Boolean)
    .map((x, k) => `<li class="${(c.done || []).includes(k) ? "sdone" : ""}" data-cstep="${i}|${k}" role="button" tabindex="0" aria-pressed="${(c.done || []).includes(k)}">${timerize(stepHtml(c.id, x, rac), `${shortRec(c.id)} · pas ${k + 1}`)}</li>`).join("");
  return `<section class="cook-slide" aria-label="${esc(r.Nom)}">
    <h3 class="cook-h">${esc(r.Nom)}${assignedTo(iso(today()), c.id) ? ` ${whoTag(assignedTo(iso(today()), c.id))}` : ""}</h3>
    <div class="row wrap cook-meta"><div class="stepper"><button data-crac="${i}|-1" aria-label="Menys racions">−</button><b>${fmtN(rac)}</b><button data-crac="${i}|1" aria-label="Més racions">+</button><span class="sub">rac.</span></div>
      <span class="sub">≈ ${esc(r.Temps_Actiu_min)} min de feina · ${esc(r.Temps_Total_min)} min en total</span></div>
    ${portionLine(c.id, rac)}
    <details class="cook-ing"><summary>Ingredients</summary>${ings || '<p class="sub">Sense ingredients</p>'}</details>
    <h4 class="cook-sub">Preparació <span class="sub">· toca un pas per marcar-lo</span></h4>
    <ol class="steps">${steps}</ol>${r.Notes ? `<p class="sub"><b>Notes:</b> ${esc(r.Notes)}</p>` : ""}
    <div class="row wrap cook-act"><button class="btn primary" data-cdone="${esc(c.id)}">✓ Acabada</button><button class="btn" data-cstop="${esc(c.id)}">Deixar de cuinar</button><button class="link" data-recipe="${esc(c.id)}" data-rac-open="${rac}">Fitxa completa ›</button></div>
  </section>`;
}
function openCooking(focusId) {
  const L = cookList(); if (!L.length) { closeSheet(true); renderCooking(); return; }
  let idx = Math.max(0, L.findIndex(c => c.id === focusId)); if (focusId === undefined) idx = Math.min(state.cookIdx || 0, L.length - 1);
  const dots = L.map((c, i) => `<button class="cdot" data-cgo="${i}" aria-label="${esc(recName(c.id))}"></button>`).join("");
  openSheet(`Cuinant (${L.length})`, `<p class="wake-ind" id="wakeInd"></p>
    <div class="cook-nav"><button class="iconbtn" data-cnav="-1" aria-label="Recepta anterior">‹</button><div class="cdots">${dots}</div><button class="iconbtn" data-cnav="1" aria-label="Recepta següent">›</button></div>
    ${L.length > 1 ? `<div class="row" style="justify-content:flex-end;margin:-2px 0 4px"><button class="link" id="cookStopAll">Deixar de cuinar-les totes</button></div>` : ""}
    <div class="cook-car" id="cookCar">${L.map(cookSlide).join("")}</div>`);
  $("#sheet").classList.add("cooking"); $("#sheet").onkeydown = null; keepAwake(true);
  const car = $("#cookCar"), sheet = $("#sheet");
  const cur = () => Math.round(car.scrollLeft / Math.max(1, car.clientWidth));
  const mark = () => { const i = cur(); state.cookIdx = i; $$("#sheetBody .cdot").forEach((d, k) => d.classList.toggle("on", k === i)); $("#sheetTitle").textContent = `Cuinant ${i + 1}/${L.length} · ${recName(L[i]?.id)}`; };
  const go = i => { i = Math.max(0, Math.min(L.length - 1, i)); car.scrollTo({ left: i * car.clientWidth, behavior: smooth() }); sheet.scrollTop = 0; };
  car.scrollLeft = idx * car.clientWidth; mark();
  let t; car.onscroll = () => { clearTimeout(t); t = setTimeout(mark, 60); };
  $$("#sheetBody [data-cnav]").forEach(b => b.onclick = () => go(cur() + num(b.dataset.cnav)));
  $$("#sheetBody [data-cgo]").forEach(b => b.onclick = () => go(num(b.dataset.cgo)));
  $$("#sheetBody [data-cstep]").forEach(li => li.onclick = e => { if (e.target.closest("button")) return; const [i, k] = li.dataset.cstep.split("|").map(Number);
    const c = L[i], d = new Set(c.done || []); d.has(k) ? d.delete(k) : d.add(k); c.done = [...d]; SET.cooking = L; saveSET(); li.classList.toggle("sdone", d.has(k)); li.setAttribute("aria-pressed", d.has(k)); });
  $$("#sheetBody [data-tmr]").forEach(b => b.onclick = e => { e.stopPropagation(); startTimer(num(b.dataset.tmr), b.dataset.tlabel); });
  $$("#sheetBody [data-cstep]").forEach(li => li.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); li.click(); } });
  sheet.onkeydown = e => { if (!sheet.classList.contains("cooking") || /INPUT|TEXTAREA/.test(e.target.tagName)) return; if (e.key === "ArrowRight") go(cur() + 1); if (e.key === "ArrowLeft") go(cur() - 1); };
  $$("#sheetBody [data-crac]").forEach(b => b.onclick = () => { const [i, dlt] = b.dataset.crac.split("|").map(Number); L[i].rac = Math.max(1, L[i].rac + dlt); SET.cooking = L; saveSET(); const y = sheet.scrollTop; openCooking(L[i].id); sheet.scrollTop = y; });
  $$("#sheetBody [data-cstop]").forEach(b => b.onclick = () => { stopCooking(b.dataset.cstop); openCooking(); });
  // per si s'han començat per error o per provar: totes fora d'un cop (amb «Desfer» a l'avís)
  const sa = $("#cookStopAll"); if (sa) sa.onclick = () => { const prev = cookList(); SET.cooking = []; saveSET(); renderCooking(); closeSheet(true);
    toast(`Has deixat de cuinar ${prev.length} receptes`, { label: "Desfer", fn: () => { SET.cooking = prev; saveSET(); renderCooking(); openCooking(); } }); };
  $$("#sheetBody [data-cdone]").forEach(b => b.onclick = () => {
    const id = b.dataset.cdone, d = today();
    // si avui hi havia una tasca de cuinar o preparar aquesta recepta, queda marcada com a feta
    const tk = tasksOn(d).find(x => x.type === "cook" && (x.rids || [x.rid]).includes(id) && !isDone(d, "Tasca", taskKey(x)));
    if (tk) toggleTask(d, taskKey(tk), tk.text, true);
    stopCooking(id); toast(tk ? `Acabada: ${recName(id)} · tasca d'avui marcada com a feta` : `Acabada: ${recName(id)}`);
    if (cookList().length) openCooking(); else { closeSheet(true); }
    const y = scrollY; render(); scrollTo(0, y);
  });
}

/* ================= Temporitzadors (mode Cuinant) ================= */
// Els temps dels passos («sofregeix 6 min», «Programa 20 min», «Bull 5 minuts») es poden tocar per engegar un compte enrere.
// N'hi pot haver diversos alhora; es veuen en una barra a baix i sonen (i vibren) en acabar. Es guarden en aquest dispositiu.
const K_TIMERS = "menu.timers.v1";
let TIMERS = lsGet(K_TIMERS) || [];
const saveTimers = () => lsSet(K_TIMERS, TIMERS);
const TIME_RE = /(\d+(?:[,.]\d+)?)(?:\s*[-–]\s*(\d+(?:[,.]\d+)?))?\s*(minuts|minut|min|hores|hora|h)\b/gi;
// només dins del text (no dins de les etiquetes HTML); els temps de menys d'1 minut (p. ex. «4 s / vel 5») no en fan
function timerize(html, label) {
  return html.split(/(<[^>]+>)/).map(p => p.startsWith("<") ? p : p.replace(TIME_RE, (m, a, b, u) => {
    const n = Math.max(num(a), num(b)), secs = Math.round(n * (/^h/i.test(u) ? 3600 : 60)); if (secs < 60) return m;
    return `<button type="button" class="tmr" data-tmr="${secs}" data-tlabel="${esc(label)}" aria-label="Engegar un temporitzador de ${esc(m)}">⏱ ${m}</button>`; })).join("");
}
let audioCtx = null;
// So de temporitzador, com el del mòbil: quatre tocs curts i suaus (to pur) i una pausa; es repeteix fins que s'atura.
// El volum depèn del volum multimèdia del dispositiu.
function beep() {
  try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume?.(); const t0 = audioCtx.currentTime;
    for (let i = 0; i < 4; i++) { const o = audioCtx.createOscillator(), g = audioCtx.createGain(), s = t0 + i * 0.22; o.type = "sine"; o.frequency.value = 1046; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.6, s + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.16); o.start(s); o.stop(s + 0.17); }
  } catch (e) { }
  try { navigator.vibrate?.([150, 70, 150, 70, 150]); } catch (e) { }
}
let lastRing = 0;
function startTimer(secs, label) {
  try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume?.(); } catch (e) { } // el so només es pot activar amb un toc
  TIMERS.push({ id: uid(), label, total: secs, end: Date.now() + secs * 1000 }); saveTimers(); renderTimers();
}
// nom curt d'una recepta per a la barra de temporitzadors: «Llenties estofades amb verdures» → «Llenties estofades»
const shortRec = id => recName(id).split(/ amb | \(| a la | al /)[0];
const fmtClock = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };
let timerTick = null;
function renderTimers() {
  let bar = $("#timerBar");
  if (!TIMERS.length) { bar?.remove(); document.body.classList.remove("has-timers"); clearInterval(timerTick); timerTick = null; return; }
  if (!bar) { bar = document.createElement("div"); bar.id = "timerBar"; bar.className = "timerbar"; bar.setAttribute("role", "status"); bar.setAttribute("aria-live", "polite"); document.body.appendChild(bar); }
  document.body.classList.add("has-timers");
  const now = Date.now();
  // mentre n'hi hagi algun d'acabat, torna a sonar cada 2 s fins que es tanca (✓)
  if (TIMERS.some(t => t.end <= now) && now - lastRing > 1900) { lastRing = now; beep(); }
  // si l'app no és a la vista (mòbil bloquejat, una altra app), també un avís del sistema, un sol cop per temporitzador
  for (const t of TIMERS) if (t.end <= now && !t.notified && document.hidden) { t.notified = true; saveTimers(); notify(`⏰ ${t.label}`, "Temps!", "timer-" + t.id, { requireInteraction: true, vibrate: [150, 70, 150, 70, 150] }); }
  bar.innerHTML = TIMERS.map(t => { const left = (t.end - now) / 1000, over = left <= 0;
    return `<div class="tchip ${over ? "over" : ""}"><span class="tc-l">${esc(t.label)}</span><b>${over ? "Temps!" : fmtClock(left)}</b>
      ${over ? "" : `<button data-tplus="${t.id}" aria-label="Un minut més">+1</button>`}<button data-tdel="${t.id}" aria-label="${over ? "Tancar" : "Aturar"} el temporitzador">${over ? "✓" : "✕"}</button></div>`; }).join("");
  $$("[data-tplus]", bar).forEach(b => b.onclick = () => { const t = TIMERS.find(x => x.id === b.dataset.tplus); if (t) { t.end += 60000; saveTimers(); renderTimers(); } });
  $$("[data-tdel]", bar).forEach(b => b.onclick = () => { TIMERS = TIMERS.filter(x => x.id !== b.dataset.tdel); saveTimers(); renderTimers(); });
  document.body.style.setProperty("--tbh", bar.offsetHeight + "px"); // els avisos (toast) es posen just a sobre de la barra
  if (!timerTick) timerTick = setInterval(renderTimers, 500);
}

/* ================= App a la web: sense connexió, avisos, dreceres ================= */
// Només quan s'obre des de la web (https o localhost). Obrint l'HTML com a fitxer, res d'això s'activa.
const isWeb = location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
let swReg = null;
async function setupWeb() {
  if (!isWeb) return;
  if ("serviceWorker" in navigator) { try { swReg = await navigator.serviceWorker.register("sw.js"); } catch (e) { console.warn("sw", e); } }
  try { await navigator.storage?.persist?.(); } catch (e) { } // que el navegador no esborri les dades locals si va just d'espai
  // dreceres de la icona de l'app: ?v=shop (Compra), ?v=inv (Rebost), ?timer=1 (temporitzador nou)
  const q = new URLSearchParams(location.search);
  if (q.get("v") && DB && VIEWS[q.get("v")]) go(q.get("v"));
  if (q.get("timer") && DB) openTimerForm();
  if ([...q.keys()].length) history.replaceState(null, "", location.pathname);
  await registerPeriodic();
  queueAvisos();
}
// Avisos de cada dispositiu: un resum del matí amb les tasques del dia i un recordatori al vespre del que encara és pendent
const avCfg = () => Object.assign({ on: false, mati: "08:00", vespre: "20:30" }, SET.avisos || {});
async function notify(title, body, tag, extra = {}) {

  const opt = { body, tag, icon: "icon-192.png", badge: "icon-192.png", lang: "ca", renotify: true, data: { url: "./" }, ...extra };

}
// IndexedDB que comparteixen l'app i el service worker: el pla d'avisos dels propers dies i quins ja s'han mostrat
const avDb = { open() { return new Promise((res, rej) => { const r = indexedDB.open("a-taula-avisos", 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { const db = await this.open(); return new Promise(res => { const t = db.transaction("k").objectStore("k").get(k); t.onsuccess = () => { res(t.result); db.close(); }; t.onerror = () => { res(null); db.close(); }; }); },
  async set(k, v) { const db = await this.open(); return new Promise(res => { const t = db.transaction("k", "readwrite").objectStore("k").put(v, k); t.onsuccess = () => { res(true); db.close(); }; t.onerror = () => { res(false); db.close(); }; }); } };
function avisText(d, kind) {
  const ts = tasksOn(d).filter(x => !isDone(d, "Tasca", taskKey(x)));
  if (!ts.length) return null;
  const list = ts.slice(0, 5).map(x => `• ${x.text}`).join("\n") + (ts.length > 5 ? `\n… i ${ts.length - 5} més` : "");
  return kind === "mati" ? { title: `A taula! · ${ts.length} ${ts.length === 1 ? "tasca" : "tasques"} avui`, body: list } : { title: "Abans d'anar a dormir: encara pendent", body: list };
}
let avTimers = [], avQ = null;
const queueAvisos = () => { if (!isWeb) return; clearTimeout(avQ); avQ = setTimeout(scheduleAvisos, 1500); };
async function scheduleAvisos() {
  avTimers.forEach(clearTimeout); avTimers = [];
  const c = avCfg(), t = today();
  try { navigator.setAppBadge && (DB ? navigator.setAppBadge(tasksOn(t).filter(x => !isDone(t, "Tasca", taskKey(x))).length) : navigator.clearAppBadge()); } catch (e) { }
  if (!DB) return;
  // pla per al service worker (per si l'app és tancada): els propers 7 dies
  const days = {}; for (let i = 0; i < 7; i++) { const d = addDays(t, i); const m = avisText(d, "mati"), v = avisText(d, "vespre"); if (m) days[iso(d)] = { mati: m, vespre: v }; }
  await avDb.set("pla", { on: c.on, mati: c.mati, vespre: c.vespre, days, at: nowIso() }).catch(() => { });
  if (!c.on || window.Notification?.permission !== "granted") return;
  const vist = (await avDb.get("vist").catch(() => null)) || {};
  for (const kind of ["mati", "vespre"]) {
    const [h, mi] = String(c[kind]).split(":").map(Number), at = new Date(t.getFullYear(), t.getMonth(), t.getDate(), h || 0, mi || 0), key = `${iso(t)}|${kind}`;
    const fire = async () => { const v = (await avDb.get("vist").catch(() => null)) || {}; if (v[key]) return; const txt = avisText(today(), kind); v[key] = 1; await avDb.set("vist", v); if (txt) notify(txt.title, txt.body, "avis-" + kind); };
    if (vist[key]) continue;
    const ms = at - Date.now();
    if (ms <= 0) { if (kind === "vespre" || Date.now() - at < 6 * 3600e3) fire(); } // l'avís del matí només fins 6 h més tard
    else if (ms < 24 * 3600e3) avTimers.push(setTimeout(fire, ms));
  }
}
// Amb l'app instal·lada, Chrome pot despertar el service worker de tant en tant per mostrar l'avís encara que l'app sigui tancada
async function registerPeriodic() {
  try { if (!swReg?.periodicSync) return "no";
    const st = await navigator.permissions.query({ name: "periodic-background-sync" }); if (st.state !== "granted") return "no";
    await swReg.periodicSync.register("avisos", { minInterval: 3 * 3600e3 }); return "sí"; } catch (e) { return "no"; }
}
async function enableAvisos(on) {
  if (on) { if (!("Notification" in window)) { toast("Aquest navegador no permet avisos"); return false; }
    const p = await Notification.requestPermission(); if (p !== "granted") { toast("Cal donar permís d'avisos a Chrome per a aquesta web"); return false; } }

}

/* ================= Nutrició de la setmana per persona ================= */
// Mitjana diària de la setmana (dilluns a diumenge) per a cada persona, i quants dies queda per sota de l'objectiu
// (o per sobre, en el sodi). Els dies amb un àpat lliure no hi compten: no se sap què s'hi menja.
function openNutriWeek(off = 0) {
  const t = today(), mon = addDays(t, -dayIdx(t) + 7 * off), days = [...Array(7)].map((_, i) => addDays(mon, i));
  const rows = [["Energia", 0, "Energia_Est_kcal", "kcal"], ["Proteïna", 1, "Proteina_Obj_g", "g"], ...MIN];
  const cards = activePersons().map(p => {
    const ok = days.filter(d => !APATS.some(a => { const m = resolveMeal(d, a); return m && !m.rid && eats(d, a, p); }));
    if (!ok.length) return `<div class="card"><b>${esc(p.Nom)}</b><p class="sub">Aquesta setmana no hi ha cap dia sense àpats lliures.</p></div>`;
    const tot = ok.map(d => personTotals(d, p));
    const lines = rows.map(([n, i, col, u]) => { const o = num(p[col]); if (!o) return ""; const isMax = col === "Sodi_Max_mg", vals = tot.map(x => x[i]), avg = vals.reduce((s, v) => s + v, 0) / vals.length;
      const bad = vals.filter(v => isMax ? v > o : v < o * 0.85).length, pct = avg / o * 100, dec = i === 6 || i === 8 ? 1 : 0;
      return `<div class="nw-row ${bad * 2 >= vals.length && i ? "warn" : ""}"><span class="nw-n">${n}</span><span class="nw-v">${fmtN(avg, dec)} / ${fmtN(o, dec)} ${u}${isMax ? " màx" : ""}</span>
        <span class="bar"><i style="width:${Math.min(100, pct)}%" class="${isMax ? (pct > 100 ? "high" : "") : pct < 85 ? "low" : ""}"></i></span>
        <span class="nw-d">${!i ? "orientatiu" : bad ? `${isMax ? "per sobre" : "per sota"} ${bad} de ${vals.length} dies` : "✓ cada dia"}</span></div>`; }).join("");
    return `<div class="card"><div class="row"><b>${esc(p.Nom)}</b><span class="spacer"></span><span class="sub">mitjana de ${ok.length} ${ok.length === 1 ? "dia" : "dies"}</span></div>${lines}</div>`;
  }).join("");
  openSheet(`Nutrició · setmana del ${fmtShort(mon)}`, `<div class="row" style="gap:8px;margin-bottom:8px"><button class="btn small" data-nwk="${off - 1}">‹ Anterior</button><span class="spacer"></span>${off ? `<button class="btn small" data-nwk="0">Aquesta setmana</button>` : ""}<button class="btn small" data-nwk="${off + 1}">Següent ›</button></div>
    ${cards}<p class="sub">Es destaquen els nutrients que queden per sota del 85 % de l'objectiu (o per sobre del màxim, en el sodi) la meitat dels dies o més. Inclou els dies que ja han passat i els planificats. Valors aproximats (taules BEDCA/USDA); els objectius són al full Persones.</p>`);
  $$("#sheetBody [data-nwk]").forEach(b => b.onclick = () => openNutriWeek(num(b.dataset.nwk)));
}

/* ================= Pla de la sessió de batch ================= */
// Ordena les coccions d'un dia: primer les que tenen més temps passiu (forn, arròs…), perquè mentre es fan s'avancin les altres.
// Diu quant ocupa cada aparell i una estimació del temps total si s'encadena bé.
// Qui fa cada cocció d'un dia (Registre: Data = dia, Tipus = Repartiment, Clau = recepta, Descripcio = ID de la persona)
const assignKey = (ds, rid) => `${ds}|Repartiment|${rid}`;
const assignedTo = (ds, rid) => ST.reg[assignKey(ds, rid)]?.Descripcio || "";
const personName = pid => DB.persones.find(p => p.ID_Persona === pid)?.Nom || pid;
function sessionItems(d) {
  return tasksOn(d).filter(x => x.type === "cook").flatMap(x => (x.rids || [x.rid]).map(rid => { const r = DB.receptes[rid] || {}, act = num(r.Temps_Actiu_min), tot = Math.max(act, num(r.Temps_Total_min));
    return { rid, x, act, tot, pas: tot - act, eq: String(r.Equipament || "").split("+").map(s => s.trim()).filter(e => e && e !== "Cap") }; }))
    .sort((a, b) => b.pas - a.pas || b.tot - a.tot);
}
// Repartiment automàtic: cada recepta va a qui prefereix el seu aparell (full Persones, columna Prefereix_Equipament, p. ex.
// «Thermomix»); la resta, a qui no té preferència. Si no hi ha preferències, a qui porta menys minuts de feina.
function autoAssign(ds, items) {
  const ps = activePersons(), load = Object.fromEntries(ps.map(p => [p.ID_Persona, 0]));
  const pref = ps.map(p => [p.ID_Persona, String(p.Prefereix_Equipament || "").split(/[,+]/).map(s => norm(s)).filter(Boolean)]);
  const free = pref.filter(([, L]) => !L.length).map(([id]) => id);
  const least = ids => ids.sort((a, b) => load[a] - load[b])[0];
  batchRows(() => { for (const it of [...items].sort((a, b) => b.act - a.act)) {
    const fans = pref.filter(([, L]) => L.some(e => it.eq.some(x => norm(x) === e))).map(([id]) => id);
    const pid = fans.length ? least(fans) : free.length ? least(free) : least(Object.keys(load)); load[pid] += it.act;
    setRow("reg", assignKey(ds, it.rid), { Data: ds, Tipus: "Repartiment", Clau: it.rid, Descripcio: pid, Fet: "Sí", Detall: "" }); } });
}
// Color de cada persona (per veure d'un cop d'ull qui fa cada cosa)
const whoTag = pid => { const i = activePersons().findIndex(p => p.ID_Persona === pid); return `<span class="tag who who${Math.max(0, i) % 4}">👤 ${esc(personName(pid))}</span>`; };
// A Avui, el dia d'una sessió repartida: què fa cadascú, en ordre (el que ja està fet, ratllat)
function sessionCard(d) {
  const ds = iso(d), items = sessionItems(d); if (!items.some(it => assignedTo(ds, it.rid))) return "";
  const done = it => isDone(d, "Tasca", taskKey(it.x));
  const rows = activePersons().map(p => { const L = items.filter(it => assignedTo(ds, it.rid) === p.ID_Persona); if (!L.length) return "";
    const next = L.find(it => !done(it));
    return `<div class="ses-row">${whoTag(p.ID_Persona)}<span class="ses-l">${L.map(it => `<button class="link ses-i ${done(it) ? "done" : it === next ? "next" : ""}" data-recipe="${esc(it.rid)}"${racAttr(it.x.q)}>${esc(shortRec(it.rid))}</button>`).join(`<span class="ses-a">→</span>`)}</span></div>`; }).join("");
  return `<div class="card ses-card"><div class="row"><b>Sessió d'avui</b><span class="spacer"></span><button class="link" data-batchplan="${ds}">Pla ›</button></div>${rows}</div>`;
}
function batchRows(fn) { beginStep(); HIST.quiet = true; try { fn(); } finally { HIST.quiet = false; } }
function openBatchPlan(ds) {
  const d = fromIso(ds), ts = tasksOn(d), items = sessionItems(d), ps = activePersons();
  const byEq = {}; for (const it of items) for (const e of it.eq) (byEq[e] ||= { n: 0, min: 0 }).n++, byEq[e].min += it.tot;
  const busiest = Object.entries(byEq).sort((a, b) => b[1].min - a[1].min)[0], you = items.reduce((s, it) => s + it.act, 0);
  const split = items.some(it => assignedTo(ds, it.rid)) && ps.length > 1;
  // amb el repartiment, la feina activa es fa en paral·lel: compta qui en té més
  const per = Object.fromEntries(ps.map(p => [p.ID_Persona, items.filter(it => assignedTo(ds, it.rid) === p.ID_Persona)]));
  const work = split ? Math.max(...Object.values(per).map(L => L.reduce((s, it) => s + it.act, 0)), items.filter(it => !assignedTo(ds, it.rid)).reduce((s, it) => s + it.act, 0)) : you;
  const est = Math.max(work, busiest ? busiest[1].min : 0);
  const itemHtml = it => { const who = assignedTo(ds, it.rid);
    return `<li><span class="row" style="gap:8px;align-items:baseline"><button class="link bp-n" data-recipe="${esc(it.rid)}"${racAttr(it.x.q)}>${esc(recName(it.rid))}</button>${split ? `<span class="spacer"></span><button class="chip2 bp-who" data-bpwho="${esc(it.rid)}" aria-label="Canviar qui la fa">${who ? whoTag(who) : "Sense assignar"} ⇄</button>` : ""}</span>
      <span class="sub">${it.eq.length ? esc(it.eq.join(" + ")) + " · " : ""}${fmtN(it.act)} min de feina${it.pas > 0 ? ` · ${fmtN(it.tot)} min en total (${fmtN(it.pas)} es fa sol)` : ""} · ${racR(it.x.q)}</span></li>`; };
  const lists = split ? ps.map(p => { const L = per[p.ID_Persona]; return `<h3 class="h3">${esc(p.Nom)} · ${fmtN(L.reduce((s, it) => s + it.act, 0))} min de feina</h3><div class="card">${L.length ? `<ol class="bplan">${L.map(itemHtml).join("")}</ol>
` : `<p class="sub">Res assignat.</p>`}</div>`; }).join("")
      + (items.some(it => !assignedTo(ds, it.rid)) ? `<h3 class="h3">Sense assignar</h3><div class="card"><ol class="bplan">${items.filter(it => !assignedTo(ds, it.rid)).map(itemHtml).join("")}</ol></div>` : "")

  openSheet(`Sessió · ${fmtDate(d)}`, `<div class="card"><b>≈ ${fmtN(est)} min si ho encadeneu bé</b><p class="sub" style="margin:4px 0 0">${est === work ? `El que més temps ocupa és la feina ${split ? "de qui en té més" : "teva"} (${fmtN(work)} min)` : `L'aparell més ocupat marca el ritme: ${esc(busiest[0])}, ${fmtN(busiest[1].min)} min (feina: ${fmtN(work)} min)`}${busiest && est === work ? `; l'aparell més ocupat és ${esc(busiest[0])} (${fmtN(busiest[1].min)} min)` : ""}. Mentre una cosa es fa sola, avança la següent.</p>
      <div class="row wrap" style="gap:6px;margin-top:8px">${Object.entries(byEq).map(([e, v]) => `<span class="tag">${esc(e)} · ${v.n} · ${fmtN(v.min)} min</span>`).join("")}</div>

    ${lists}
    <button class="btn primary wide" id="bpCook" style="margin-top:10px">🍳 Cuinar ara les receptes de la sessió</button>
    ${other.length ? `<h3 class="h3">També aquest dia</h3><div class="card">${other.map(x => `<p style="margin:6px 0">${taskIcon(x)} ${esc(x.text)}</p>`).join("")}</div>` : ""}`);
  const cook = L => { for (const it of L) if (!isCooking(it.rid)) startCooking(it.rid, it.x.q); openCooking(L[0]?.rid); };

  const au = $("#bpAuto"); if (au) au.onclick = () => { autoAssign(ds, items); reopen(); };
  $$("#sheetBody [data-bpwho]").forEach(b => b.onclick = e => { e.stopPropagation(); const rid = b.dataset.bpwho, ids = ps.map(p => p.ID_Persona), cur = ids.indexOf(assignedTo(ds, rid)), nx = ids[(cur + 1) % ids.length];
    setRow("reg", assignKey(ds, rid), { Data: ds, Tipus: "Repartiment", Clau: rid, Descripcio: nx, Fet: "Sí", Detall: "" }); reopen(); });

// Compra: en quins plats es fa servir un ingredient
function openUses(it, L, mode = "shop") {
  const by = {};
  for (const u of it.uses || []) { const k = `${u.meal}|${u.apat}|${u.top}|${u.via}`; (by[k] ||= { ...u, q: 0 }).q += u.q; }
  const rows = Object.values(by).sort((a, b) => a.meal.localeCompare(b.meal) || APATS.indexOf(a.apat) - APATS.indexOf(b.apat));
  openSheet(it.ing.Nom, `${mode === "shop" ? "" : `<button class="btn small" id="usesBack" style="margin-bottom:10px">‹ Buscar un altre ingredient</button>`}<p class="sub" style="margin-top:0">${mode === "shop" ? `Cal comprar-ne ${fmtQty(it.q, it.ing.Unitat)} per a aquests plats` : `Se'n fan servir ${fmtQty(it.q, it.ing.Unitat)} en total en aquests plats`} (${fmtShort(L.from)} – ${fmtShort(L.to)}). Les quantitats són per a qui menja cada àpat.</p>
    <div class="card">${rows.map(u => `<div class="use-row"><span class="ct"><b>${esc(recName(u.top))}</b>${(() => { const m = resolveMeal(fromIso(u.meal), u.apat); return m && m.acomp === u.top && m.rid ? `<small>acompanyament de: ${esc(recName(m.rid))}</small>` : ""; })()}${u.via ? `<small>dins de: ${esc(recName(u.via))}</small>` : ""}
      <small>${u.apat ? `${esc(u.apat)} de ` : "Es fa el "}${fmtDate(fromIso(u.meal))}${u.ds !== u.meal ? ` · es cuina ${u.ds < u.meal ? "abans, el" : "el"} ${fmtDate(fromIso(u.ds))}` : ""}${u.opt ? " · opcional" : ""}</small></span>
      <span class="qty">${fmtQty(u.q, it.ing.Unitat)}</span><button class="link" data-recipe="${esc(u.via || u.top)}"${u.apat && !u.via ? racAttr(mealRac(u.meal, u.apat)) : ""}>Recepta ›</button></div>`).join("") || `<p class="sub">Sense detall.</p>`}</div>
    <p class="sub">${mode === "shop" ? "Si un plat és d'un dia fora del període, és perquè es cuina abans (per exemple, al batch del dissabte) i la compra es fa per al dia que es cuina." : "Compta el que es cuina en aquests dies (també el que es menjarà després). No compta el que ja tens preparat a la nevera o al congelador."}</p>`);
  const ub = $("#usesBack"); if (ub) ub.onclick = () => openIngSearch();
}
// Lupa: en quines receptes i dies es fa servir un ingredient (propers 14 dies)
function openIngSearch(q0 = "") {
  const t = today(), R = shoppingList([t, addDays(t, 13)], true);
  const used = new Set(Object.keys(R.need));
  const pool = Object.values(DB.ingredients).map(i => ({ label: i.Nom, ref: i.ID_Ingredient, used: used.has(i.ID_Ingredient) }));
  openSheet("Buscar un ingredient", `<p class="sub" style="margin-top:0">Escriu un ingredient per veure en quines receptes i quins dies es fa servir (${fmtShort(t)} – ${fmtShort(addDays(t, 13))}).</p>
    <input type="search" id="isQ" placeholder="Per exemple: porro, tofu, carbassa…" autocomplete="off" value="${esc(q0)}"><div id="isR" style="margin-top:10px"></div>`);
  const q = $("#isQ"), box = $("#isR");
  const draw = () => { const res = q.value.trim() ? suggest(q.value, pool, 12) : pool.filter(o => o.used).sort((a, b) => a.label.localeCompare(b.label, "ca")).slice(0, 0);
    box.innerHTML = res.length ? `<div class="card">${res.map(o => `<button class="is-row" data-ising="${esc(o.ref)}" ${o.used ? "" : "disabled"}><span>${esc(o.label)}</span><small>${o.used ? `${fmtQty(R.need[o.ref].q, DB.ingredients[o.ref].Unitat)} · ${new Set(R.need[o.ref].uses.map(u => u.top)).size} plats ›` : "no es fa servir aquests dies"}</small></button>`).join("")}</div>` : q.value.trim() ? `<p class="sub">Cap ingredient amb aquest nom.</p>` : "";
    $$("[data-ising]", box).forEach(b => b.onclick = () => { const id = b.dataset.ising, n = R.need[id]; openUses({ id, ing: DB.ingredients[id], q: n.q, uses: n.uses }, R, "search"); }); };
  q.oninput = draw; draw(); setTimeout(() => q.focus(), 50);
}

function upcomingHtml() {
    const t = today(); let h = "";
    const { tasks } = computePlan(t, addDays(t, 13)); const byDay = {};
    for (const x of tasks) if (iso(x.date) > iso(t)) (byDay[iso(x.date)] ||= []).push(x);
    if (!Object.keys(byDay).length) h += `<div class="empty">No hi ha tasques en els propers 14 dies.</div>`;
    for (const ds of Object.keys(byDay).sort()) {
      const d = fromIso(ds), ts = doneLast(byDay[ds], d), cooks = ts.filter(x => x.type === "cook");
      const act = cooks.reduce((s, x) => s + (x.rids || [x.rid]).reduce((a, r) => a + num(DB.receptes[r]?.Temps_Actiu_min), 0), 0), batch = cooks.length >= 3;
      h += `<div class="card upday"><div class="ud-h"><b>${ds === iso(addDays(t, 1)) ? "Demà" : fmtDate(d)}</b>${dayIdx(d) === 5 && cooks.length ? `<span class="tag t-cong">Sessió de batch</span>` : ""}<span class="spacer"></span>
        <span class="sub">${ts.length} ${ts.length === 1 ? "tasca" : "tasques"}${act ? ` · ≈ ${act} min` : ""}</span></div>
        ${ts.map(x => { const done = taskDone(d, x), mins = x.type === "cook" ? (x.rids || [x.rid]).reduce((s, r) => s + num(DB.receptes[r]?.Temps_Actiu_min), 0) : 0, k = `${ds}§${taskKey(x)}§${x.text}`;
          return `<div class="urow ${done ? "done" : ""}"><label class="donebox" data-tip="Marcar com a fet"><input type="checkbox" data-task="${esc(k)}" ${done ? "checked" : ""} aria-label="Fet: ${esc(x.text)}"></label>
            <button class="ur-t" data-recipe="${esc((x.rids || [x.rid])[0] || "")}"${x.pot || x.type === "take" ? "" : racAttr(x.q)}>${taskIcon(x)} ${esc(x.text)}${x.type === "cook" && assignedTo(ds, (x.rids || [x.rid])[0]) ? ` ${whoTag(assignedTo(ds, (x.rids || [x.rid])[0]))}` : ""}</button>${mins ? `<span class="tmin">≈ ${fmtN(mins)} min</span>` : ""}</div>`; }).join("")}
        <div class="row wrap ud-act"><button class="link" data-updetail="${ds}">Detall ›</button>${batch ? `<button class="link" data-batchplan="${ds}">Pla de la sessió ›</button>` : ""}</div></div>`;
    }
    return h;
  }


/* ================= Historial: editar un dia i exportar ================= */
function openDaySheet(d) {
  openSheet(fmtDate(d), proteinAlert(d) + dayTasksHtml(d, "Cap tasca.") + dayTotalsCard(d, false));
  // en canviar alguna cosa, es torna a dibuixar el full amb les dades noves
  $$("#sheetBody [data-meal], #sheetBody [data-task]").forEach(c => c.addEventListener("change", () => setTimeout(() => { render(); const sh = $("#sheet"), y = sh.scrollTop; openDaySheet(d); sh.scrollTop = y; }, 0)));
}
function exportHistory(days) {
  const t = today(), P = prodStart(); let from = addDays(t, -days); if (P && P > from) from = P;
  const to = addDays(t, -1); if (from > to) { toast("No hi ha dies per exportar"); return; }
  const ps = activePersons();
  const A = [["Data", "Dia", "Àpat", "Plat", "Acompanyament", "Estat", "Se'l salta", ...ps.map(p => `Racions ${p.Nom}`), "Kcal (ració estàndard)", "Proteïna g", "Calci mg", "Ferro mg", "Sodi mg"]];
  const D = [["Data", "Dia", ...ps.flatMap(p => [`Kcal ${p.Nom}`, `Proteïna g ${p.Nom}`, `Calci mg ${p.Nom}`]), "Proteïna completa", "Minuts de feina"]];
  const T = [["Data", "Tasca", "Tipus", "Racions", "Estat"]];
  for (let d = from; d <= to; d = addDays(d, 1)) {
    for (const a of APATS) { const m = resolveMeal(d, a); if (!m) continue; const sk = whoSkips(d, a), mm = mealMacros(m), r = ST.reg[`${iso(d)}|Apat|${a}`];
      A.push([iso(d), DOW_LONG[dayIdx(d)], a, recName(m.rid) || "Lliure", recName(m.acomp), sk.all ? "Saltat" : yes(r?.Fet) ? "Fet" : "Sense marcar", sk.names.join(", "),
        ...ps.map(p => eats(d, a, p) ? num(p.Factor_Racio) || 1 : 0), Math.round(mm[0]), Math.round(mm[1] * 10) / 10, Math.round(mm[5]), Math.round(mm[6] * 10) / 10, Math.round(mm[10])]); }
    D.push([iso(d), DOW_LONG[dayIdx(d)], ...ps.flatMap(p => { const pt = personTotals(d, p); return [Math.round(pt[0]), Math.round(pt[1]), Math.round(pt[5])]; }), proteinCheck(d).ok ? "Sí" : "No", Math.round(dayWork(d).total)]);
  }
  for (const x of computePlan(from, to).tasks) { const r = ST.reg[`${iso(x.date)}|Tasca|${taskKey(x)}`]; T.push([iso(x.date), x.text, { cook: "Cuinar", thaw: "Descongelar", previa: "Preparació prèvia" }[x.type], Math.round((x.q || 0) * 10) / 10, r ? (yes(r.Fet) ? "Feta" : "Descartada") : "Sense marcar"]); }
  const wb = XLSX.utils.book_new();
  const add = (rows, name, w) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = w.map(x => ({ wch: x })); XLSX.utils.book_append_sheet(wb, ws, name); };
  add(A, "Apats", [11, 10, 9, 40, 28, 13, 16, ...ps.map(() => 11), 12, 10, 9, 9, 9]); add(D, "Dies", [11, 10, ...ps.flatMap(() => [11, 12, 11]), 12, 12]); add(T, "Tasques", [11, 60, 16, 9, 13]);
  XLSX.writeFile(wb, `${iso(t)}-a-taula-historial-${iso(from)}-a-${iso(to)}.xlsx`); toast("Historial exportat");
}

// L'enllaç a la llista de Keep es guarda a Config (keep_url) o en aquest navegador; si no n'hi ha, s'obre Keep
const keepUrl = () => { const u = String(SET.keepUrl || DB?.config?.keep_url || ""); return /^https:\/\/keep\.google\.com\//.test(u) ? u : "https://keep.google.com/"; };
// Esborra d'aquest navegador totes les dades de l'app (no toca l'Excel)
async function forgetDevice() {
  if (Object.keys(ST.pending).length && !confirmForget.ok) { confirmForget(); return; }
  for (const k of [K_DB, K_STORE, K_SET, K_SYNC]) { try { localStorage.removeItem(k); } catch (e) { } }
  try { idb._db?.close(); idb._db = null; indexedDB.deleteDatabase("menu-fsa"); } catch (e) { }
  location.reload();
}
function confirmForget() {
  openSheet("Oblidar aquest dispositiu", `<div class="card alert danger"><p style="margin-top:0">Hi ha <b>${Object.keys(ST.pending).length} canvis</b> que encara no s'han desat a l'Excel i es perdran.</p></div>
    <div class="row" style="gap:8px"><button class="btn" id="fgNo" style="flex:1">Cancel·lar</button><button class="btn danger" id="fgYes" style="flex:1">Esborrar igualment</button></div>`);
  $("#fgNo").onclick = () => closeSheet(true); $("#fgYes").onclick = () => { confirmForget.ok = true; forgetDevice(); };
}

/* ================= Exportar / importar (navegadors sense accés a fitxers) ================= */
function exportData() {
  const deleted = Object.keys(ST.pending).filter(k => !ST.pending[k]);
  const blob = new Blob([JSON.stringify({ app: "menu-casa", version: 3, exportedAt: nowIso(), store: { inv: ST.inv, plan: ST.plan, reg: ST.reg, compra: ST.compra }, deleted, rec: ST.rec }, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${iso(today())}-menu-dades.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast("Dades exportades");
}
async function importData(file) {
  try {
    const j = JSON.parse(await file.text()); if (j.app !== "menu-casa" || !j.store) throw new Error("No és un fitxer de dades d'aquesta app");
    const okKey = k => typeof k === "string" && !["__proto__", "constructor", "prototype"].includes(k);
    beginStep(); let n = 0;
    for (const t of ["inv", "plan", "reg", "compra"]) for (const [k, r] of Object.entries(j.store[t] || {})) { if (!okKey(k) || !r || typeof r !== "object") continue; const cur = ST[t][k]; if (!cur || String(r.Actualitzat) > String(cur.Actualitzat)) { ST[t][k] = r; ST.pending[`${t}|${k}`] = 1; n++; } }
    for (const pk of j.deleted || []) { const [t, ...rest] = String(pk).split("|"), k = rest.join("|"); if (APP_SHEETS[t] && okKey(k) && ST[t][k]) { delete ST[t][k]; ST.pending[pk] = 0; n++; } }
    for (const [id, e] of Object.entries(j.rec || {})) if (okKey(id) && e?.row && Array.isArray(e.lines)) { ST.rec[id] = e; ST.pending[`rec|${id}`] = 1; n++; }
    applyRecOverlay(); saveST(); bump(); scheduleSync(); render(); toast(`Dades importades (${n} canvis)`);
  } catch (e) { alertBox("No s'han pogut importar les dades", e.message); }
}

/* ================= Etiquetes en passar el cursor ================= */
function setupTips() {
  const tip = document.createElement("div"); tip.className = "tip"; tip.setAttribute("role", "tooltip"); document.body.appendChild(tip);
  let cur = null;
  const label = el => { if (el.title) { el.dataset.tip ||= el.title; el.removeAttribute("title"); } return el.dataset.tip || el.getAttribute("aria-label") || ""; };
  document.addEventListener("pointerover", e => {
    if (e.pointerType === "touch") return;
    const el = e.target.closest?.("[data-tip], button[aria-label], button[title], label[title]"); if (!el || el === cur) return;
    const t = label(el); if (!t) return; cur = el; tip.textContent = t; tip.classList.add("show");
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8), y = r.top - h - 8; if (y < 6) y = r.bottom + 8;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  document.addEventListener("pointerout", e => { if (cur && !cur.contains(e.relatedTarget)) { cur = null; tip.classList.remove("show"); } });
  document.addEventListener("scroll", () => { cur = null; tip.classList.remove("show"); }, true);
}

let wakeLock = null, wakeVideo = null;
function wakeVideoOn() {
  if (!wakeVideo) {
    wakeVideo = document.createElement("video");
    wakeVideo.setAttribute("playsinline", ""); wakeVideo.setAttribute("muted", ""); wakeVideo.muted = true; wakeVideo.setAttribute("title", "Pantalla encesa"); wakeVideo.setAttribute("aria-hidden", "true");
    wakeVideo.style.cssText = "position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1";
    for (const [t, src] of [["webm", NOSLEEP_WEBM], ["mp4", NOSLEEP_MP4]]) { const so = document.createElement("source"); so.src = src; so.type = "video/" + t; wakeVideo.appendChild(so); }
    wakeVideo.addEventListener("loadedmetadata", () => { if (wakeVideo.duration <= 1) wakeVideo.loop = true; else wakeVideo.addEventListener("timeupdate", () => { if (wakeVideo.currentTime > 0.5) wakeVideo.currentTime = Math.random(); }); });
    document.body.appendChild(wakeVideo);
  }
  if (wakeVideo.paused) wakeVideo.play().then(renderWake, () => { });
}
const wakeState = () => wakeLock && !wakeLock.released ? "lock" : wakeVideo && !wakeVideo.paused ? "video" : "";
// withVideo: amb una recepta oberta s'engega també el vídeo, encara que el bloqueig ja estigui actiu (doble seguretat)
async function keepAwake(withVideo = false) {
  if (document.hidden) return;
  if ("wakeLock" in navigator && !wakeLock) {
    try { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; renderWake(); }); } catch (e) { wakeLock = null; }
  }
  if (withVideo === true || !wakeState()) wakeVideoOn(); // el vídeo només pot començar després d'un toc a la pantalla: per això també es crida a cada clic
  renderWake();
}
function renderWake() {
  const el = $("#wakeInd"); if (!el) return;
  const on = !!wakeState(); el.classList.toggle("off", !on);
  el.textContent = on ? "🔆 Pantalla encesa: no s'apagarà mentre tinguis la recepta oberta" : "⚠ Toca la pantalla perquè no s'apagui";
}

/* ================= Inici ================= */
document.addEventListener("DOMContentLoaded", async () => {
  setupTips();
  keepAwake(); for (const ev of ["click", "touchend", "keydown"]) document.addEventListener(ev, () => keepAwake(!!$("#wakeInd")), true);
  setInterval(() => { keepAwake(!!$("#wakeInd")); checkDay(); }, 20000);
  renderTimers(); // temporitzadors que encara corrien quan es va tancar l'app // si el sistema l'ha alliberat, es torna a demanar
  $$(".tabbar button").forEach(b => b.onclick = () => DB ? go(b.dataset.view) : toast("Primer connecta l'Excel"));
  $("#gear").onclick = () => DB ? go("settings") : null;
  $("#syncStatus").onclick = () => FS.conflict ? showRevert() : (FS.handle && !FS.granted) ? reconnect() : !FS.handle ? (fsaSupported() ? connectExcel() : go("settings")) : FS.blocked ? alertBox("No es desa a l'Excel", FS.blocked) : (FS.errors ? (toast(FS.status), syncNow()) : syncNow());
  $("#overlay").onclick = () => closeSheet(); $("#sheetClose").onclick = () => closeSheet();
  // suggeriments (ingredients, acompanyament, Rebost): fletxa avall hi entra, fletxes per moure's, Enter tria, Esc torna
  const sugBox = el => el.matches?.("[data-ln]") ? $(`[data-ls="${el.dataset.ln}"]`) : el.id === "acQ" ? $("#acS") : el.id === "fNom" ? $("#fSug") : null;
  document.addEventListener("keydown", e => {
    const t = e.target, box = sugBox(t);
    if (box && e.key === "ArrowDown" && !box.hidden) { e.preventDefault(); box.querySelector("button")?.focus(); return; }
    const sb = t.closest?.("[data-sk],[data-k],[data-si]"); if (!sb) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sb.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true })); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); (e.key === "ArrowDown" ? sb.nextElementSibling : sb.previousElementSibling)?.focus(); }
    else if (e.key === "Escape") { e.stopImmediatePropagation(); const inp = [...$$("[data-ln], #acQ, #fNom")].find(i => sugBox(i)?.contains(sb)); sb.parentElement.hidden = true; inp?.focus(); }
  }, true);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) { e.preventDefault(); e.shiftKey ? redo() : undo(); } });
  $("#undoB").onclick = undo; $("#redoB").onclick = redo;
  document.addEventListener("click", e => { if (e.target.id === "connectB" && !DB) connectExcel(); });
  document.addEventListener("change", e => { if (e.target.id === "fileIn" && e.target.files[0]) loadReadOnly(e.target.files[0]); });
  document.addEventListener("dragover", e => { e.preventDefault(); $("#drop")?.classList.add("over"); });
  document.addEventListener("drop", e => { e.preventDefault(); $("#drop")?.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f && $("#drop")) loadReadOnly(f); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkExternal(); keepAwake(); checkDay(); queueAvisos(); } else if (Object.keys(ST.pending).length) syncNow(); });
  window.addEventListener("pagehide", () => { saveST(); if (Object.keys(ST.pending).length) syncNow(); });
  window.addEventListener("pageshow", e => { if (e.persisted) { checkExternal(); checkDay(); } });
  window.addEventListener("focus", checkExternal);
  // una altra pestanya ha canviat les dades d'aquest navegador: es fan servir les seves (si aquí no hi ha res a mig desar)
  window.addEventListener("storage", e => { if (e.key !== K_STORE || !e.newValue || FS.saving) return; const o = JSON.parse(e.newValue); if (!o) return; ST = o; for (const k of ["inv", "plan", "reg", "compra", "pending"]) ST[k] ||= {}; ST.rec ||= {}; if (DB) applyRecOverlay(); bump(); render(); });
  if (DB && (!DB.config?.data_inici_cicle || !DB.options)) DB = null;
  render();
  setupWeb();
  if (fsaSupported()) {
    try {
      const h = await idb.get("handle-v3");
      if (h) { FS.handle = h; FS.granted = (await h.queryPermission({ mode: "readwrite" })) === "granted"; if (FS.granted) { await loadFromHandle(); if (Object.keys(ST.pending).length) scheduleSync(300); } else render(); }
    } catch (e) { console.warn(e); }
  }
});
